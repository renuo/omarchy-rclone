# Settings for this one mount. Every rclone flag can be given as an RCLONE_*
# variable: --vfs-cache-max-size 50G becomes RCLONE_VFS_CACHE_MAX_SIZE=50G.
# All flags: https://rclone.org/commands/rclone_mount/
# Remove the # in front of a line to use it.

[Service]
# Disk space the cache may take (default 20G).
#Environment=RCLONE_VFS_CACHE_MAX_SIZE=50G

# How long an unused file stays in the cache (default 1h). Long keeps the
# mount usable offline for everything you opened before.
#Environment=RCLONE_VFS_CACHE_MAX_AGE=8760h

# Disk space that must stay free; the cache shrinks below its size to keep it.
#Environment=RCLONE_VFS_CACHE_MIN_FREE_SPACE=10G

# How long a folder listing is trusted (default 5m). Changes made elsewhere
# show up after it, or with F5.
#Environment=RCLONE_DIR_CACHE_TIME=1000h

# Walk the whole remote at start, so the first browse is fast.
#Environment=RCLONE_VFS_REFRESH=true

# Upload bandwidth limit, e.g. during working hours only.
#Environment="RCLONE_BWLIMIT=08:00,5M 19:00,off"
